# Netlify reads this automatically on every deploy.
# It builds the static site and publishes the generated dist/ folder.
[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Long cache for images/CSS/JS, always-fresh HTML
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
